# Render Blueprint: one web service runs the backend (Express API) and the frontend (Next.js) together.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: ajeneza-thierry
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # PORT is injected by Render automatically; the server listens on it.
      - key: DATABASE_URL
        sync: false            # paste the Render PostgreSQL internal URL
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false            # e.g. https://ajeneza-thierry.onrender.com or your custom domain
      - key: CLOUDINARY_URL
        sync: false            # recommended: Render's disk is wiped on every deploy
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
